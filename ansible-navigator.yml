ansible-navigator:
  # Defaults so you can just run `./run.sh` (or `ansible-navigator run`) with no
  # extra flags. Positional/CLI args still override anything set here.
  ansible:
    playbook:
      path: dispatch_config.yml
    inventory:
      entries:
        - inventory
    # Extra args passed straight through to ansible-playbook inside the EE.
    # Paths are relative to this dir (navigator mounts it into the container).
    cmdline: "-e @vars.yml -e @vars_secrets.yml --vault-password-file .vault_pass"
  execution-environment:
    image: quay.io/redhat_emp1/ee-ansible-ssa
    pull:
      # 'missing' = only pull if not already present locally (no re-pull each run).
      # Change back to 'always' if you want to force the latest EE every time.
      policy: missing
    container-options:
      - "--network=host"
    environment-variables:
      pass:
        - CONTROLLER_HOST
        - CONTROLLER_USERNAME
        - CONTROLLER_PASSWORD
        - CONTROLLER_VERIFY_SSL
        - CONTROLLER_API_PATH
        - PYTHONHTTPSVERIFY
    #volume-mounts:
    #  - src: "/home/amaya/.ansible/collections"
    #    dest: "/home/runner/.ansible/collections" # No tocar esto, es la clave
    #    options: "Z"
  logging:
    append: true
    file: /tmp/navigator/ansible-navigator.log
  playbook-artifact:
    enable: false
  mode: stdout
